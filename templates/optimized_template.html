<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج الحضور المحسن - Optimized Attendance Template</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: white;
            color: black;
            direction: rtl;
        }
        
        .header {
            height: 30mm;
            border-bottom: none;
            margin-bottom: 10mm;
            position: relative;
        }
        
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10mm;
        }
        
        .doc-number {
            font-size: 14pt;
            font-weight: bold;
        }
        
        .year {
            font-size: 16pt;
            font-weight: bold;
        }
        
        .location-date {
            text-align: center;
            margin: 10mm 0;
        }
        
        .location {
            font-size: 12pt;
            margin-bottom: 5mm;
        }
        
        .date {
            font-size: 12pt;
            border-bottom: 1px solid black;
            display: inline-block;
            min-width: 80mm;
            text-align: center;
            padding: 2mm;
        }
        
        .table-container {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10mm;
        }
        
        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid black;
        }
        
        .table-header {
            background: white;
            border-bottom: 2px solid black;
        }
        
        .table-header th {
            padding: 3mm;
            text-align: center;
            font-weight: bold;
            font-size: 11pt;
            border-left: 1px solid black;
            height: 10mm;
            vertical-align: middle;
        }
        
        .table-header th:first-child {
            border-left: none;
        }
        
        .table-row {
            height: 8mm;
            border: none;
        }
        
        .table-row td {
            border-left: 1px solid black;
            border-bottom: none;
            padding: 2mm;
            text-align: center;
            vertical-align: middle;
            font-size: 10pt;
        }
        
        .table-row td:first-child {
            border-left: none;
        }
        
        /* Column-specific styling */
        .col-index {
            width: 15mm;
        }
        
        .col-name {
            width: 60mm;
            text-align: right;
        }
        
        .col-attendance-time {
            width: 25mm;
            background: white;
            font-weight: bold;
        }
        
        .col-rank {
            width: 40mm;
            background: white;
            font-weight: bold;
        }
        
        .col-shift {
            width: 25mm;
            background: white;
            font-weight: bold;
        }
        
        .col-signature {
            width: 30mm;
        }
        
        .col-notes {
            width: 40mm;
        }
        
        /* Target columns highlighting for development */
        .target-column {
            position: relative;
        }
        
        .target-column::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 0, 0.1);
            pointer-events: none;
        }
        
        /* Remove highlighting for production */
        @media print {
            .target-column::before {
                display: none;
            }
        }
        
        .row-number {
            font-size: 9pt;
            color: #666;
        }
    </style>
</head>
